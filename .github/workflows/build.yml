name: CI

on:
  push:
    branches: [ master, 'ps-*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  SDL2_VERSION: 2.0.16

jobs:
  linux:
    name: Linux (${{ matrix.bits }}-bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 64
            is64bit: 1
            experimental: false
          # 32-bit Linux needs i386 SDL2 packages, which are fragile on recent
          # Ubuntu runners (see INSTALL_PC.md). Reported, but non-blocking.
          - bits: 32
            is64bit: 0
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      COMPARE: 0
      IS64BIT: ${{ matrix.is64bit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (64-bit)
        if: ${{ matrix.is64bit == 1 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libsdl2-dev

      - name: Install dependencies (32-bit)
        if: ${{ matrix.is64bit == 0 }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libpng-dev libsdl2-dev:i386

      - name: Build
        run: make -j"$(nproc)" linux

      # PS-011: run the multiplayer self-test (loopback UDP on 127.0.0.1:27590-27599,
      # wire helpers, player summary). It runs before any window or save is opened;
      # the dummy SDL drivers are only a safety net. A non-zero exit fails the job.
      - name: Multiplayer self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: timeout 360 ./pokemon-spectrum${{ matrix.bits }} --mp-selftest # PS-053: +~70 s for the traffic benchmark

      # PS-014: crash-safe save I/O (write .tmp + fsync + rename, read back, leftover .tmp,
      # slow-save path, in-memory ReadFlash). Uses pokemon-spectrum.sav.selftest, never a real save.
      - name: Save self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: timeout 60 ./pokemon-spectrum${{ matrix.bits }} --save-selftest

      # PS-080: the built-in Mystery Gift distributor, headless: the four ticket cards through the
      # in-process loopback link (card and RAM script saved and valid, toss / already-have-it /
      # no-more-gifts paths), gift script sizes, and refused blocks (bad size, ident, CRC).
      - name: Mystery Gift self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: timeout 60 ./pokemon-spectrum${{ matrix.bits }} --mg-selftest

      # BUG-002: boot smoke test. Runs the real game (no flags, fresh save) for 40 s under gdb with
      # dummy SDL drivers: boot, copyright screen, intro, title. A crash prints a backtrace and
      # fails the job. A clean timeout (the game is still running) passes.
      - name: Boot smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          sudo apt-get install -y -qq gdb > /dev/null
          rm -f ci_boot.sav
          set +e
          timeout -s INT 40 gdb -q -batch -ex "handle SIGINT stop" -ex run -ex bt -ex "info registers rip" --args ./pokemon-spectrum${{ matrix.bits }} --save ci_boot.sav 2>&1 | tee boot.log
          set -e
          if grep -qE "SIGSEGV|SIGABRT|SIGBUS|SIGFPE|SIGILL|exited with code [0-9]|exited normally" boot.log; then
            echo "::error::game crashed or quit during boot (see log above)"
            exit 1
          fi
          echo "boot smoke test: still running after 40 s, OK"

      # PS-058: audio check. Boots the real game (fresh save: intro and title music) with the
      # dummy SDL drivers and --audio-stats, 20 s per run. The dummy audio driver consumes 1024
      # samples every 24 ms, about 1.5% faster than a real 42048 Hz sound card, so this is a
      # harder test than a real PC. --debug-loop-hz holds the main loop to a monitor's refresh
      # rate, like vsync does on a real PC (v0.1.0 underran 4-5 times a second at 59.94 and 60).
      # Fails if a normal run (free, 59.94, 60 Hz) has an underrun or a clipped sample, unless
      # the runner itself stalled the game for more than 40 ms. The --audio-legacy and 30 Hz
      # runs are reported only.
      - name: Audio check
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          fail=0
          for run in free 59.94 60 30 legacy-59.94; do
            rm -f ci_audio.sav
            extra=""
            case "$run" in
              free) ;;
              legacy-*) extra="--audio-legacy --debug-loop-hz ${run#legacy-}" ;;
              *) extra="--debug-loop-hz $run" ;;
            esac
            timeout -s INT 20 ./pokemon-spectrum${{ matrix.bits }} --save ci_audio.sav --audio-stats $extra --audio-dump ci_audio_$run.wav > audio_$run.log 2>&1
            echo "=== audio check, loop $run: $(grep '\[audio\] summary' audio_$run.log)"
            result=$(grep '\[audio\] result:' audio_$run.log)
            echo "    $result"
            case "$run" in
              free|59.94|60)
                underruns=$(echo "$result" | sed -n 's/.*underruns=\([0-9]*\).*/\1/p')
                clipped=$(echo "$result" | sed -n 's/.*clipped=\([0-9]*\).*/\1/p')
                stall=$(echo "$result" | sed -n 's/.*max_stall_ms=\([0-9]*\).*/\1/p')
                if [ -z "$underruns" ]; then
                  echo "::error::audio check ($run): no result line"; grep "\[audio\]" audio_$run.log; fail=1
                elif [ "$clipped" != 0 ]; then
                  echo "::error::audio check ($run): $clipped clipped samples"; fail=1
                elif [ "$underruns" != 0 ] && [ "$stall" -le 40 ]; then
                  echo "::error::audio check ($run): $underruns underruns without a runner stall"; grep "\[audio\]" audio_$run.log; fail=1
                elif [ "$underruns" != 0 ]; then
                  echo "::warning::audio check ($run): $underruns underruns, but the runner stalled ${stall} ms"
                fi
                ;;
            esac
          done
          exit $fail

      - name: Upload audio dumps
        if: ${{ matrix.is64bit == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: audio-check-linux${{ matrix.bits }}
          path: |
            ci_audio_*.wav
            audio_*.log
          if-no-files-found: warn

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-spectrum-linux${{ matrix.bits }}
          path: pokemon-spectrum${{ matrix.bits }}
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.bits }}-bit, mingw cross)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 64
            is64bit: 1
            triplet: x86_64-w64-mingw32
          - bits: 32
            is64bit: 0
            triplet: i686-w64-mingw32
    env:
      COMPARE: 0
      IS64BIT: ${{ matrix.is64bit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev g++-mingw-w64-i686 g++-mingw-w64-x86-64

      # Same SDL2 mingw dev package as INSTALL_PC.md, extracted to ./SDL2
      - name: Fetch SDL2 mingw dev libs
        run: |
          tarball="SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          curl -fsSL -o "$tarball" "https://www.libsdl.org/release/$tarball" \
            || curl -fsSL -o "$tarball" "https://archive.org/download/sdl-2-${SDL2_VERSION}/$tarball"
          tar -xzf "$tarball"
          mv "SDL2-${SDL2_VERSION}" SDL2
          rm "$tarball"

      - name: Build
        run: make -j"$(nproc)" winwsl

      - name: Package executable with SDL2.dll
        run: |
          mkdir -p dist
          cp pokemon-spectrum${{ matrix.bits }}.exe dist/
          cp SDL2/${{ matrix.triplet }}/bin/SDL2.dll dist/
          cp pokemon-spectrum.map dist/   # crash reporter: resolve exe offsets (BUG-003)

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-spectrum-windows${{ matrix.bits }}
          path: dist/
          if-no-files-found: error
